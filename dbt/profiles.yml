northwind:
  target: dev
  outputs:

    dev:
      type: snowflake

      account: "{{ env_var('SNOWFLAKE_ORGANIZATION_NAME') }}-{{ env_var('SNOWFLAKE_ACCOUNT_NAME') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      authenticator: "{{ env_var('SNOWFLAKE_AUTHENTICATOR') }}"

      warehouse: ADHOC_WH_DEV
      database: NORTHWIND_DEV

      schema: "{{ env_var('UNIQUE_SCHEMA_PREFIX') }}"

      threads: 4

    ci:
      type: snowflake

      account: "{{ env_var('SNOWFLAKE_ORGANIZATION_NAME') }}-{{ env_var('SNOWFLAKE_ACCOUNT_NAME') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"

      warehouse: ADHOC_WH_DEV
      database: NORTHWIND_DEV

      schema: "CI_{{ env_var('PR_NUMBER') }}"

      threads: 4
