# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  # Only used to pick the warehouse literal for deploy-tasks below (dev |
  # tst | prd). Which Snowflake connection is used is NOT controlled here
  # -- it's whatever SNOWFLAKE_DEFAULT_CONNECTION_NAME currently points at
  # (see .env.example), so make sure the two agree with each other.
  ENV: '{{.ENV | default "dev"}}'

tasks:
  format:
    cmd: sqruff fix -f human .

  lint:
    cmd: sqruff lint -f human .

  create-tables:
    desc: Creates any missing tables against the currently active connection.
    method: none
    cmds:
      - for: sources
        cmd: snow sql -f "{{.ITEM}}"
    sources:
      - "create-tables/*.sql"

  create-load-procedures:
    desc: Deploys the LOAD_* stored procedures to the currently active connection.
    method: none
    cmds:
      - for: sources
        cmd: snow sql -f "{{.ITEM}}"
    sources:
      - "load-tables/*.sql"

  load:
    desc: Calls LANDING.LOAD_ALL() to run the full load against the currently active connection.
    cmd: snow sql -q "CALL LANDING.LOAD_ALL();"

  deploy-tasks:
    desc: Deploys the Snowflake TASK objects to the currently active connection, created suspended.
    method: none
    cmds:
      - for: sources
        cmd: >-
          snow sql -D "warehouse=LOADING_WH_{{.ENV | upper}}" -f "{{.ITEM}}"
    sources:
      - "tasks/*.sql"

  info:
    cmds:
      - echo "Root {{.ROOT_DIR}}"
      - echo "Current {{.TASKFILE_DIR}}"
      - echo "Working {{.USER_WORKING_DIR}}"
      - echo "Env {{.ENV}}"
